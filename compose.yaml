services:
  app:
    build: .
    working_dir: /app/refresh_meter_app
    volumes:
      - .:/app
      - bundle-data:/usr/local/bundle
    command: bash -lc "bundle install && rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DATABASE_URL: mysql2://minitech:password@db:3306/minitech_development
    
  db:
    build:
      context: ./docker/mysql
    image: minitech-mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: minitech_development
      MYSQL_USER: minitech
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  db-data:
  bundle-data:
